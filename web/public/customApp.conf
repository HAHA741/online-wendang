server {
    listen 3018;
    server_name fortune-web;
    client_max_body_size 100M;

    # 【关键】在 server 层级直接定义 root，这样下面所有的 location 都会默认继承它
    root /usr/share/nginx/fortune-web;
    index index.html;

    # gzip 配置保持不变...
    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;
    
    # 安全响应头保持不变...
    add_header X-Frame-Options SAMEORIGIN always;

    # 1. 静态资源处理
    # 增加 _next 路径的支持，确保 Next.js 的资源能被找到
    location /_next/ {
        alias /usr/share/nginx/fortune-web/_next/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 其他通用静态文件
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        # 确保这里能找到文件
        try_files $uri =404;
    }

    # 2. SPA 路由处理
    location / {
        # 这里的 try_files 顺序：文件 -> 目录 -> 带有.html后缀的文件 -> index.html
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 3. 特殊处理 JSON
    location ~ .*\.(json)$ {
        add_header Content-Disposition 'attachment';
        add_header Content-type application/octet-stream;
    }

    # 4. 修复错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        # 指向 Nginx 自带的错误页目录，或者你的项目目录
        root /usr/share/nginx/html; 
    }
}